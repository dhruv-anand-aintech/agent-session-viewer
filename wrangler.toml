name = "agent-session-viewer"
main = "worker/index.ts"
compatibility_date = "2026-07-08"

[assets]
directory = "./dist"
binding = "ASSETS"

[[routes]]
pattern = "agent-session-viewer.ainorthstar.tech/*"
zone_name = "ainorthstar.tech"

# Move this machine's direct tunnel to:
#   asv-dhruv.ainorthstar.tech -> http://127.0.0.1:3001

[vars]
GCS_BUCKET = "agent-session-viewer-sessions-onboarding-host-1d21888935424f"
LOCAL_AGENT_BASE_URL = "https://asv-dhruv.ainorthstar.tech"
MACOS_APP_DOWNLOAD_URL = "https://agent-session-viewer.ainorthstar.tech/downloads/AgentSessionViewer-macOS.zip"
MACOS_APP_VERSION = "0.1.0-beta.1"
MACOS_APP_SHA256 = "8c0be31c3dd7f5d043edc51c628049cd4b299fbc4113547315a17423a60e53bc"
MACOS_APP_MIN_VERSION = "14.0"
# AGENT_PROVIDER_CONFIG = '{"providers":[{"id":"modal","label":"Modal","kind":"cloud-http","endpoint":"https://example.com/api/agent/chat","agents":["codex"]}]}'
# GOOGLE_CLIENT_ID = "..."

[[d1_databases]]
binding = "AUTH_DB"
database_name = "agent-session-viewer-auth"
database_id = "4a11792f-beb5-4573-ac08-5b0f0a5f0dd9"

# Required secrets:
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   SESSION_SECRET
#   GCP_SERVICE_ACCOUNT_EMAIL
#   GCP_PRIVATE_KEY
#
# Optional R2 fallback instead of GCS:
# [[r2_buckets]]
# binding = "SESSION_BUCKET"
# bucket_name = "agent-session-viewer-sessions"
